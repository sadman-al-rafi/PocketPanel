name: Publish PocketPanel release

# Manual only. This workflow must never run on a push, tag, pull request,
# schedule, workflow_run or any other automatic event. Publishing also
# requires the `PUBLISH` confirmation input and approval of the `release`
# environment (required reviewers must be configured in repository settings).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0; must match release/version.properties'
        required: true
        type: string
      confirm:
        description: 'Type PUBLISH to authorize publishing'
        required: true
        type: string
        default: 'CANCEL'

permissions:
  contents: write

concurrency:
  group: pocketpanel-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    if: inputs.confirm == 'PUBLISH'
    env:
      RELEASE_KEYSTORE: ${{ runner.temp }}/pocketpanel-release.jks
      SOURCE_ZIP: ${{ runner.temp }}/pocketpanel-source.zip
      POCKETPANEL_RELEASE_STORE_FILE: ${{ runner.temp }}/pocketpanel-release.jks
      POCKETPANEL_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      POCKETPANEL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      POCKETPANEL_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle from the committed wrapper
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Validate release inputs and secrets
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E '^versionName=' release/version.properties | cut -d= -f2)
          if [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "Tag '$RELEASE_TAG' does not match v$VERSION_NAME from release/version.properties" >&2
            exit 1
          fi
          for value in "$POCKETPANEL_RELEASE_STORE_PASSWORD" \
                       "$POCKETPANEL_RELEASE_KEY_ALIAS" \
                       "$POCKETPANEL_RELEASE_KEY_PASSWORD" \
                       "$EXPECTED_CERT_SHA256"; do
            if [ -z "$value" ]; then
              echo "A required release secret is missing" >&2
              exit 1
            fi
          done

      - name: Decode release keystore into a temporary file
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          chmod 600 "$RELEASE_KEYSTORE"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature and certificate fingerprint
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs --verbose "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | tr -d ':' | tr -d ' ' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Certificate fingerprint does not match the expected release identity" >&2
            exit 1
          fi

      - name: Create source archive from the released commit
        run: |
          set -euo pipefail
          # git archive includes only tracked files at this commit, so no
          # local secrets, build outputs or untracked files are packaged.
          git archive --format=zip --output="$SOURCE_ZIP" "$GITHUB_SHA"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketpanel-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: pocketpanel-source
          path: ${{ runner.temp }}/pocketpanel-source.zip
          if-no-files-found: error

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          gh release create "$RELEASE_TAG" "$APK" "$SOURCE_ZIP" \
            --title "PocketPanel ${RELEASE_TAG#v}" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RELEASE_KEYSTORE"
