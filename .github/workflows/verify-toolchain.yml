name: Verify toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: verify-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Resolve and build with the pinned toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-read-only: false

      - name: Prepare log directory
        run: mkdir -p "$RUNNER_TEMP/logs"

      - name: Install Android SDK packages
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > "$RUNNER_TEMP/logs/sdk-licenses.log" 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" \
            2>&1 | tee "$RUNNER_TEMP/logs/sdkmanager.log"

      - name: Record tool versions
        run: |
          set -o pipefail
          {
            java -version
            echo
            gradle --version
            echo
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo
            echo "Installed platforms:"
            ls "$ANDROID_HOME/platforms" 2>/dev/null || true
            echo "Installed build-tools:"
            ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          } 2>&1 | tee "$RUNNER_TEMP/logs/versions.log"

      - name: Resolve build environment
        run: |
          set -o pipefail
          gradle :app:buildEnvironment --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/buildEnvironment.log"

      - name: Resolve Kotlin and Compose dependencies
        run: |
          set -o pipefail
          gradle :app:dependencies --configuration debugCompileClasspath 2>&1 \
            | tee "$RUNNER_TEMP/logs/dependencies-debugCompileClasspath.log"

      - name: Compile Kotlin with the Compose compiler
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --info --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/compileDebugKotlin.log"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/assembleDebug.log"

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/testDebugUnitTest.log"

      - name: Summarize resolved versions
        if: always()
        run: |
          {
            echo "### Toolchain verification"
            echo
            echo "Kotlin stdlib resolved on debugCompileClasspath:"
            echo '```'
            grep -E "kotlin-stdlib" \
              "$RUNNER_TEMP/logs/dependencies-debugCompileClasspath.log" 2>/dev/null \
              | sort -u | head -20 || true
            echo '```'
            echo
            echo "Kotlin entries on the app buildscript classpath:"
            echo '```'
            grep -E "kotlin" "$RUNNER_TEMP/logs/buildEnvironment.log" 2>/dev/null \
              | head -30 || true
            echo '```'
            echo
            echo "APK output:"
            echo '```'
            find app/build/outputs/apk -type f 2>/dev/null || true
            echo '```'
          } | tee "$RUNNER_TEMP/logs/summary.md"
          cat "$RUNNER_TEMP/logs/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pocketpanel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: warn
