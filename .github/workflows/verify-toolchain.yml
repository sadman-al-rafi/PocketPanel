name: Verify toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: verify-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Resolve and build with the pinned toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-read-only: false

      - name: Prepare log directory
        run: mkdir -p "$RUNNER_TEMP/logs"

      - name: Record tool versions and preinstalled SDK
        run: |
          set -o pipefail
          {
            java -version
            echo
            gradle --version
            echo
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "Installed platforms:"
            ls "$ANDROID_HOME/platforms" 2>/dev/null || true
            echo "Installed build-tools:"
            ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
            echo "Installed platform-tools:"
            ls "$ANDROID_HOME/platform-tools" 2>/dev/null | head -5 || true
          } 2>&1 | tee "$RUNNER_TEMP/logs/versions.log"

      - name: Resolve build environment
        run: |
          set -o pipefail
          gradle :app:buildEnvironment --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/buildEnvironment.log"

      - name: Resolve Kotlin and Compose dependencies
        run: |
          set -o pipefail
          gradle :app:dependencies --configuration debugCompileClasspath 2>&1 \
            | tee "$RUNNER_TEMP/logs/dependencies-debugCompileClasspath.log"

      - name: Compile Kotlin with the Compose compiler
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --info --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/compileDebugKotlin.log"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/assembleDebug.log"

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/testDebugUnitTest.log"

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Toolchain verification"
            echo
            echo "Result: \`${{ job.status }}\`"
            echo
            echo "## Resolved Kotlin / Compose entries"
            echo '```'
            grep -E "kotlin|compose" \
              "$RUNNER_TEMP/logs/dependencies-debugCompileClasspath.log" 2>/dev/null \
              | sort -u | head -40 || true
            echo '```'
            echo
            echo "## Buildscript Kotlin / AGP entries"
            echo '```'
            grep -E "kotlin|com\\.android\\.tools\\.build" \
              "$RUNNER_TEMP/logs/buildEnvironment.log" 2>/dev/null \
              | head -40 || true
            echo '```'
            echo
            echo "## APK output"
            echo '```'
            find app/build/outputs/apk -type f 2>/dev/null || true
            echo '```'
          } | tee "$RUNNER_TEMP/logs/summary.md"
          cat "$RUNNER_TEMP/logs/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect verification results
        if: always()
        run: |
          set +e
          mkdir -p ci-results
          {
            echo "commit: $GITHUB_SHA"
            echo "run_id: $GITHUB_RUN_ID"
            echo "run_number: $GITHUB_RUN_NUMBER"
            echo "job_status: ${{ job.status }}"
            echo "finished_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Steps with logs captured:"
            ls -1 "$RUNNER_TEMP/logs" 2>/dev/null
          } > ci-results/status.txt

          cp "$RUNNER_TEMP/logs/versions.log" ci-results/versions.log 2>/dev/null
          grep -E "kotlin|compose|com\\.android\\.tools\\.build" \
            "$RUNNER_TEMP/logs/buildEnvironment.log" \
            > ci-results/buildEnvironment-filtered.log 2>/dev/null
          grep -E "kotlin|compose" \
            "$RUNNER_TEMP/logs/dependencies-debugCompileClasspath.log" \
            > ci-results/dependencies-filtered.log 2>/dev/null
          tail -n 300 "$RUNNER_TEMP/logs/compileDebugKotlin.log" \
            > ci-results/compile-tail.log 2>/dev/null
          tail -n 150 "$RUNNER_TEMP/logs/assembleDebug.log" \
            > ci-results/assemble-tail.log 2>/dev/null
          tail -n 100 "$RUNNER_TEMP/logs/testDebugUnitTest.log" \
            > ci-results/tests-tail.log 2>/dev/null
          find app/build/outputs/apk -type f \
            > ci-results/apk-files.txt 2>/dev/null
          ls -l app/build/outputs/apk/debug \
            >> ci-results/apk-files.txt 2>/dev/null
          echo "collected"

      - name: Publish results to the ci-results branch
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-results
          git add ci-results
          git commit -m "Toolchain verification results (run $GITHUB_RUN_ID)"
          git push --force origin ci-results
          echo "publish exit: $?"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pocketpanel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: warn
